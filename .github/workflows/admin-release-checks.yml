name: AERLON Admin release checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without automatic postinstall
        run: npm install --ignore-scripts
      - name: Run complete AERLON release checks
        env:
          SESSION_SECRET: test-only-ci-secret-not-used-in-production-2026
        run: npm run check
