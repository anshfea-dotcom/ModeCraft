<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Your wishlist | AERLON</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{--bg:#faf8f4;--ink:#201e1b;--line:#d8d1c7;margin:0;background:var(--bg);color:var(--ink);font:16px Arial,sans-serif}body.dark{--bg:#201e1b;--ink:#faf8f4;--line:#504c46}header,main{max-width:1280px;margin:auto;padding:0 clamp(18px,5vw,72px)}header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}a{color:inherit}.brand{font:600 25px Georgia,serif;letter-spacing:.16em;text-decoration:none}.shop{font-size:14px;text-underline-offset:4px}.heading{padding:clamp(32px,6vw,72px) 0 22px;border-bottom:1px solid var(--line);margin-bottom:24px}h1{font:normal clamp(40px,6vw,76px)/1.05 Georgia,serif;letter-spacing:-.045em;margin:0}#status{margin:12px 0 0}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(235px,100%),1fr));gap:32px 20px;margin-bottom:60px}article{position:relative}article a{text-decoration:none;display:block}article img{display:block;background:#ede8e0;width:100%;aspect-ratio:4/5;object-fit:cover}h2{font:500 20px Georgia,serif;margin:13px 0 8px}.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}.price del,.sale-discount{font-size:12px}.heart{position:absolute;right:8px;top:8px;width:44px;height:44px;border:1px solid #ddd5cb;border-radius:50%;background:#fff;color:#302720;font-size:21px;cursor:pointer}#empty{padding:40px 0}#empty p{margin:0 0 24px}.action{display:inline-block;background:var(--ink);color:var(--bg);padding:13px 21px;text-decoration:none;border:0;cursor:pointer}button:disabled{opacity:.5}@media(max-width:600px){header{height:62px}#grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}h2{font-size:17px}}
</style></head><body><header><a class="brand" href="/">AERLON</a><a class="shop" href="/#shop">Continue shopping</a></header><main><div class="heading"><h1>Your wishlist</h1><p id="status" role="status">Loading saved styles…</p></div><div id="grid"></div><div id="empty" hidden><p>Tap the heart on a product to save it here.</p><a class="action" href="/#shop">Explore the collection</a></div><button class="action" id="retry" hidden>Try again</button></main><script src="/catalogue-product.js"></script><script src="/wishlist.js"></script></body></html>
