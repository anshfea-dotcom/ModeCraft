name: AERLON secret scanning (all Git history)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: Scan current files and all fetched Git refs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all branches and tags for history scanning
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - name: Scan complete fetched Git history (redact secrets)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --log-opts="--all" --redact /workspace
      - name: Scan current working tree (redact secrets)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact /workspace
