<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>My Wishlist | AERLON</title>
  <link rel="stylesheet" href="/wishlist.css">
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 4.7a5.3 5.3 0 0 0-7.5 0L12 6l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.8a5.3 5.3 0 0 0 0-7.5Z"/></symbol>
  <symbol id="bag" viewBox="0 0 24 24"><path d="M5 7.5h14l1.2 13H3.8zM8.5 9V6a3.5 3.5 0 0 1 7 0v3"/></symbol>
  <symbol id="trash" viewBox="0 0 24 24"><path d="M3.5 6h17M9 6V3.5h6V6M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
</svg>
<script src="/store-header.js"></script>
<main>
  <section class="hero"><div><h1>My Wishlist <svg aria-hidden="true"><use href="#heart"/></svg></h1><p>Your handpicked styles, all in one place.</p></div></section>
  <section class="sheet" id="saved" aria-label="Saved items">
    <div class="bar"><strong id="count">Saved items</strong><button id="clear" hidden><svg><use href="#trash"/></svg> Clear All</button></div>
    <p id="status" role="status">Loading saved styles…</p><div id="grid"></div>
    <div id="empty" hidden><svg><use href="#heart"/></svg><h2>Your wishlist is empty</h2><p>Tap the heart on a product to save it here.</p><a class="gold" href="/#shop">Explore the collection</a></div>
    <button class="gold" id="retry" hidden>Try again</button>
    <a class="summary" href="/?panel=bag" hidden><svg><use href="#heart"/></svg><span><strong id="summaryCount"></strong><small>View your shopping bag</small></span><b aria-hidden="true">›</b></a>
  </section>
</main>
<template id="item"><article><a class="photo"><img alt=""><span aria-hidden="true"><svg><use href="#heart"/></svg></span></a>
  <div class="details"><h2><a></a></h2><div class="pricing"></div><label class="variant">Size <select></select></label>
  <div class="actions"><button class="gold buy"><svg><use href="#bag"/></svg> Add to Bag</button><button class="remove"><svg><use href="#trash"/></svg> Remove</button></div></div></article></template>
<script src="/catalogue-product.js"></script><script src="/wishlist.js"></script>
</body></html>
